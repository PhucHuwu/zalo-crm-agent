<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
<rect width="1100" height="640" rx="18" fill="#f2f5ef"/>
<g font-family="Arial, sans-serif" fill="#24342d">
<text x="45" y="55" font-size="25" font-weight="700">Khách được giao cho sale bằng nhãn Zalo</text>
<text x="45" y="88" font-size="17" fill="#53655a">Sơ đồ minh họa • Mọi ứng dụng của một OA đều thấy toàn bộ hội thoại</text>
<rect x="45" y="140" width="250" height="150" rx="12" fill="#24644e"/>
<text x="68" y="182" font-size="22" font-weight="700" fill="#fff">Zalo OA</text>
<text x="68" y="214" font-size="17" fill="#e7f1e8">Toàn bộ hội thoại</text>
<text x="68" y="242" font-size="17" fill="#e7f1e8">với khách</text>
<text x="68" y="272" font-size="15" fill="#cfe3d4">Đọc 1 lần mỗi ngày</text>
<path d="M295 215H350" stroke="#758c7b" stroke-width="3"/>
<path d="M350 215V160H400 M350 215V270H400 M350 215V380H400" fill="none" stroke="#758c7b" stroke-width="3"/>
<rect x="400" y="125" width="300" height="70" rx="12" fill="#fff" stroke="#b8cabd"/>
<text x="422" y="157" font-size="19" font-weight="700">Chị Hoa</text><text x="422" y="182" font-size="16" fill="#53655a">Nhãn: Sale: Minh</text>
<rect x="400" y="235" width="300" height="70" rx="12" fill="#fff" stroke="#b8cabd"/>
<text x="422" y="267" font-size="19" font-weight="700">Anh Tuấn</text><text x="422" y="292" font-size="16" fill="#53655a">Nhãn: Sale: Lan</text>
<rect x="400" y="345" width="300" height="70" rx="12" fill="#fff6e5" stroke="#e0c48a"/>
<text x="422" y="377" font-size="19" font-weight="700">Khách mới</text><text x="422" y="402" font-size="16" fill="#7a5a1c">Chưa có nhãn</text>
<path d="M700 160H760 M700 270H760 M700 380H760" stroke="#758c7b" stroke-width="3"/>
<rect x="760" y="125" width="295" height="70" rx="12" fill="#e6eddf" stroke="#b8cabd"/>
<text x="782" y="157" font-size="19" font-weight="700">Minh</text><text x="782" y="182" font-size="16">Ứng dụng 1 • task, brief</text>
<rect x="760" y="235" width="295" height="70" rx="12" fill="#e6eddf" stroke="#b8cabd"/>
<text x="782" y="267" font-size="19" font-weight="700">Lan</text><text x="782" y="292" font-size="16">Ứng dụng 2 • task, brief</text>
<rect x="760" y="345" width="295" height="70" rx="12" fill="#fff6e5" stroke="#e0c48a"/>
<text x="782" y="377" font-size="19" font-weight="700">Người quản lý</text><text x="782" y="402" font-size="16">Chọn sale để giao</text>
<rect x="45" y="465" width="1010" height="130" rx="12" fill="#fff" stroke="#b8cabd"/>
<text x="68" y="503" font-size="19" font-weight="700">Gắn nhãn thế nào?</text>
<text x="68" y="537" font-size="17">1. Sale tự gắn nhãn của mình trong OA Manager (oa.zalo.me) khi nhận khách — nên làm.</text>
<text x="68" y="569" font-size="17">2. Hoặc nhắn Claude “Giao khách &lt;tên&gt; cho &lt;sale&gt;” — Claude gỡ nhãn sale khác rồi gắn nhãn mới.</text>
</g></svg>
